[workspace]
members = [
    "wgpu_app",
    "practice01",
    "practice02",
    "practice03",
    "practice04",
    "practice05",
    "practice06",
    "practice07",
    "practice08",
    "practice09",
    "practice10",
]
resolver = "2"

[workspace.dependencies]
winit = "0.30"
wgpu = "30"
wgpu_app = { path = "./wgpu_app" }
glam = { version = "0.29", features = ["bytemuck"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
